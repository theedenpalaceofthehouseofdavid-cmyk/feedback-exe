name: build-windows-exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 feedback_intel_web.cpp -o feedback_intel_web.exe -lws2_32 -static
      - uses: actions/upload-artifact@v4
        with:
          name: feedback_intel_web_exe
          path: feedback_intel_web.exe
